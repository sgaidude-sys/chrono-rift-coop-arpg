name = "chrono-rift-signal"
main = "src/index.js"
compatibility_date = "2026-11-01"

# multiplayer on/off switch: change to "false" (dashboard: Workers > chrono-rift-signal > Settings > Variables)
[vars]
MP_ENABLED = "true"
# relay passes (TURN credentials) handed out per UTC day; keeps usage inside the free 1,000 GB / month
TURN_DAILY_CAP = "300"
# relayed sessions (game traffic through this service when direct links are blocked) per UTC day, 1 hour each
RELAY_DAILY_CAP = "30"
# new rooms pause (friendly "realms are busy") when this many are open at once ...
ROOMS_CONCURRENT_CAP = "25"
# ... or when today's open-room time reaches this many minutes (~100 room-hours, inside the free plan)
ROOM_MINUTES_DAILY_CAP = "6000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# free plan: SQLite-backed Durable Objects only
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
